[pytest]
# On-device (HIL) suite — see README.md in this directory.
# Tiers are markers, selected with -m (run-device-tests.sh does this for you).
markers =
    smoke: fast read-only sanity checks (~1 min, no reboots)
    integration: functional regression tests; may reboot, never lose data
    destructive: wipes settings/FAT or forces crashes; reprovision afterwards
    dfu: MCUmgr firmware-update loop (forward-only; OVERWRITE_ONLY board)
    soak: long-running drift/timing assertions (minutes to hours)
    requires_battery: skip unless VBAT_PRESENT=1
    requires_no_battery: skip unless VBAT_PRESENT=0
    requires_vbus: skip unless VBUS_PRESENT=1
    requires_charging: skip unless battery + VBUS + charging enabled
    requires_provisioned: FAIL (not skip) if the board is missing baseline assets
    requires_ext(name): skip unless the named extension is loaded
# Live console output is invaluable when a board test hangs.
log_cli = true
log_cli_level = INFO
