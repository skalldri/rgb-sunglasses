CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y
# Patched flashdisk copy (issue #380) instead of the SDK driver, same as the
# proto0 board conf — so this suite exercises the driver the device runs.
CONFIG_DISK_DRIVER_FLASH=n
CONFIG_DISK_DRIVER_FLASH_PATCHED=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# storage_fat_corrupt_boot_sector() is gated on this symbol, same as the shell command.
CONFIG_APP_CRASH_TEST_COMMANDS=y
