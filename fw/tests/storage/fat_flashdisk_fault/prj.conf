CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Proto0 disk geometry: FatFS sector == flash erase page == 4096 (the SDK
# default of 512 would silently change the failure surface under test).
CONFIG_FS_FATFS_MAX_SS=4096

# The unit under test — the issue #380 backport. The .sdk_tripwire scenario
# overrides both to build against the SDK driver instead.
CONFIG_DISK_DRIVER_FLASH=n
CONFIG_DISK_DRIVER_FLASH_PATCHED=y
