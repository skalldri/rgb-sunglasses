CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_DISK_ACCESS=y
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Proto0 disk geometry: FatFS sector == flash erase page == 4096 (the SDK
# default of 512 would silently change the failure surface under test).
CONFIG_FS_FATFS_MAX_SS=4096

# Mirror proto0's FatFS threading configuration (issue #380 layer 2) so this
# suite builds and exercises the FS stack the device actually runs — review
# finding: before this, no native_sim build compiled FS_FATFS_REENTRANT at
# all. The concurrency hammer test depends on these.
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_REENTRANT=y

# The unit under test — the issue #380 backport. The .sdk_tripwire scenario
# overrides both to build against the SDK driver instead.
CONFIG_DISK_DRIVER_FLASH=n
CONFIG_DISK_DRIVER_FLASH_PATCHED=y
