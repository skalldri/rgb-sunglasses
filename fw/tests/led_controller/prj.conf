CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y

# The led_output shell command is part of the unit under test; drive it through
# the dummy backend (shell_execute_cmd) rather than poking internals.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=y

# Per-segment CPU attribution in led_controller.cpp reads the display thread's
# execution_cycles; without this the field does not exist and the unit under test
# refuses to compile (deliberately — see the #error there).
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
