CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y

# The led_output shell command is part of the unit under test; drive it through
# the dummy backend (shell_execute_cmd) rather than poking internals.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=y
# The dummy backend TRUNCATES output past its buffer with no error, and the
# tests strstr the LAST lines of cmd_led_stats's ~8-line output ("held frames:",
# "overruns:"). The default (400 here — LOG_PRINTK bumps it from 300) leaves
# only ~125 B of headroom, and a single verdictText() suffix (+68 chars per
# flagged line) would push those lines off the end and fail the wrong assert
# (PR #381 review round 6). 1024 keeps the whole output comfortably inside.
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=1024

# Per-segment CPU attribution in led_controller.cpp reads the display thread's
# execution_cycles; without this the field does not exist and the unit under test
# refuses to compile (deliberately — see the #error there).
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y
