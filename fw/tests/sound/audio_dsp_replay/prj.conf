# Same DSP/C++ environment as fw/tests/sound/audio_dsp, minus CONFIG_ZTEST:
# this app has a plain main() so it can double as a CLI WAV-replay tool.
# On native_sim, REQUIRES_FULL_LIBC/LIBCPP select the HOST glibc/libstdc++
# (EXTERNAL_LIBC default), so main() can use getenv/fopen/printf on host paths.
CONFIG_CPP=y
CONFIG_STD_CPP2B=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_FPU=y
CONFIG_FPU_SHARING=y
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_COMPLEXMATH=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_WINDOW=y
CONFIG_LOG=y
