# WTF is going on in these functions...
# CONFIG_OUTPUT_DISASSEMBLY=y

# Enable C++ Language Support
CONFIG_CPP=y

# Enable support for C++23 (HELL YEAH!)
CONFIG_STD_CPP2B=y

# Link against the C++ Standard Library
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y

# Allow bonding with more than one phone over the device's lifetime; once full, evict the
# oldest bond instead of rejecting new pairing attempts outright.
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Stored-CCC capacity. The default (48) overflowed when issue #264 Phase 2 added three
# notify characteristics to the audio config service ("Too many Client Characteristic
# Configuration" at settings load, hardware-observed 2026-08-02) - every notifying
# characteristic across all services contributes one CCC per bonded peer slot. 96 is
# the Kconfig range maximum.
CONFIG_BT_SETTINGS_CCC_STORE_MAX=96

# Secure Connections Only mode (issue #232): every pairing is evaluated at L4 - an
# unauthenticated (Just Works), non-SC, or <16-byte-key pairing is REJECTED with SMP
# error 0x03 (Authentication Requirements), so an unauthenticated bond can never be
# created. Note this rejects rather than upgrades a weak pairing attempt; the early
# bt_conn_set_security(L4) in bluetooth.cpp's connected() callback is what steers the
# phone into a passkey pairing in the first place. Together they collapse Android's
# old two-prompt flow (Just Works consent, then passkey re-pair) into one passkey prompt.
CONFIG_BT_SMP_SC_ONLY=y

# Peripheral Preferred Connection Parameters (PPCP, Generic Access Service 0x2A04).
# Android reads this at connection time and uses it when making its own connection-parameter
# decisions (e.g. during BluetoothGatt.refresh()). Matching it to fast_conn_param avoids a
# ~440ms excursion to 45ms that occurs when Android temporarily reverts to the PPCP range
# before the app's requestConnectionPriority(HIGH) takes effect. Units: 1.25ms for intervals,
# 10ms for timeout. Values mirror fast_conn_param in bluetooth.cpp (6-12 units, timeout 400).
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Enable dynamic BT device name (allows changing name at runtime)
CONFIG_BT_DEVICE_NAME_DYNAMIC=y

# Needed for GATT Long Write
CONFIG_BT_ATT_PREPARE_COUNT=4

# 2048 -> 3072 alongside CONFIG_BT_SETTINGS_CCC_STORE_MAX=96 (issue #264 Phase 2):
# bt_gatt_store_ccc() keeps a struct ccc_store[CCC_STORE_MAX] frame on this stack
# (~4 B/entry, so 48->96 grew that frame by ~192 B) and runs here via the delayed-store
# work with the settings/NVS QSPI write path stacked below it. The extra 1 KB is
# headroom against that growth; a measured high-water pass (CONFIG_THREAD_ANALYZER
# during a bond store) can right-size it later.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072

# Do NOT try to make the system workqueue preemptible (attempted for issue #267, reverted).
# It stays cooperative at the default -1, and that is enforced by the SDK, not a choice:
# both zephyr/subsys/bluetooth/Kconfig ("The Bluetooth subsystem requires the system
# workqueue to execute at a cooperative priority") and
# zephyr/subsys/ipc/ipc_service/lib/Kconfig.icmsg constrain SYSTEM_WORKQUEUE_PRIORITY to
# range -256..-1 here, so a positive value is rejected at configure time with
# "user value 10 ... ignored due to being outside the active range". The consequence for
# frame pacing (BT bond/CCC writes reach QSPI flash from a thread nothing can preempt) is
# documented in fw/docs/threading.md, "What is still unpreemptable".

CONFIG_BOOTLOADER_MCUBOOT=y

CONFIG_NRF53_UPGRADE_NETWORK_CORE=y

# CONFIG_NRF53_UPGRADE_NETWORK_CORE pulls in a RAM-backed flash simulator (see
# overlays/net_core_sim_flash.overlay) to stage netcore DFU images before copying them
# to the netcore's real flash. CONFIG_FLASH_SIMULATOR_STATS defaults to y (it selects
# the STATS/STATS_NAMES subsystems purely for debug operation counters on that
# RAM-backed staging buffer) -- not needed for actual functionality, disabled to save
# ~4KB FLASH (issue #79 flash investigation).
CONFIG_FLASH_SIMULATOR_STATS=n

CONFIG_OUTPUT_PRINT_MEMORY_USAGE=y

CONFIG_SPI=y

CONFIG_LED=y

CONFIG_LED_STRIP=y

CONFIG_WS2812_STRIP_SPI=y

# Old USB device stack has bugs in the mass storage class implementation
# Use the new USB device stack which has a much better USB MSC implementation.
#CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=y

CONFIG_SERIAL=y

CONFIG_CONSOLE=y

CONFIG_UART_CONSOLE=y

CONFIG_UART_LINE_CTRL=y

# USBD Next CDC ACM class — auto-enabled by DT_HAS_ZEPHYR_CDC_ACM_UART_ENABLED,
# but listed explicitly for clarity. Replaces the old CONFIG_USB_CDC_ACM.
CONFIG_USBD_CDC_ACM_CLASS=y

# Hardware info provides a unique USB serial number from the device FICR.
CONFIG_HWINFO=y
# CONFIG_HWINFO_SHELL is deliberately NOT enabled. It links a second copy of the
# RESET_* name table that src/debug/reset_reason_core.c already carries, and registers a
# `hwinfo reset_cause` command that would read 0 forever once this firmware has cleared
# the register — a command guaranteed to mislead whoever runs it. `hwinfo devid` was the
# only reason to want it, and that is available as `reset_cause devid`.

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# Unused and takes space
# CONFIG_LOG_RUNTIME_FILTERING=y
# The pre-thread boot phase (POST_KERNEL SYS_INIT through APPLICATION SYS_INIT) generates
# ~110 packed log_msg records averaging ~273 bytes each = ~30 KB of burst before the log
# processing thread ever gets CPU time. Smaller buffers drop some of that burst
# (measured: 8 KB -> 80 drops, 16 KB -> 50 drops) -- but those are early boot-log lines
# only, not functional data. Dropped 16 KB -> 8 KB in the issue #75 follow-up RAM pass:
# the extra ~30 dropped lines are boot-log cosmetics, not worth 8 KB of RAM.
CONFIG_LOG_BUFFER_SIZE=8192

# DEBUG_COREDUMP moved to the proto0 board conf (issue #80): capture now targets the
# proto0-only internal-flash coredump_partition via the NCS flash backend, and the
# legacy DK board (dk-support branch, ~95% flash used) dropped coredump support
# entirely to reclaim ROM.

CONFIG_EXTRA_EXCEPTION_INFO=y

# Enable thread performance monitoring
CONFIG_THREAD_MONITOR=y

# Enable the home-built TPS25750 USB Power Delivery controller driver
CONFIG_TPS25750=y

# Need I2C to talk to various components
CONFIG_I2C=y

CONFIG_FLASH=y

# Enable the home-built BQ25792 battery charger driver
CONFIG_BQ25792=y

# Enable a shell that will let us debug the NVM settings
CONFIG_SETTINGS_SHELL=y

# Name-lookup cache for the NVS settings backend (issue #311).
#
# Without it, settings_nvs_save() resolves a key by walking every name id from
# last_name_id down to NVS_NAMECNT_ID, doing an nvs_read() per id. A HIT exits
# that loop early, but a MISS — a first write of a new key, or a delete of a key
# that is not present — always runs the walk to completion. Measured on proto0
# (fw-v3.2.0, 19 keys resident): a miss costs 850-1500 ms, against 1-15 ms for a
# hit. That is a QSPI read storm on the same MX25R6435F the FAT disk lives on.
#
# With the cache loaded and not overflowed, settings_nvs_save() skips the walk
# entirely on a miss (see the `goto found` guarded by SETTINGS_NVS_CACHE_OVFL in
# zephyr/subsys/settings/src/settings_nvs.c) — so sizing it above the key count is
# what makes the fix work.
#
# SIZE THIS AGAINST CHURN, NOT AGAINST RESIDENT KEYS. `cache_total` is set to the
# resident count at load (settings_nvs.c:148) and then only ever INCREMENTED, once
# per first-write of a new name (:349). The delete branch (:283) returns before any
# cache bookkeeping, so deleting a key never frees its slot or decrements the
# counter. The number that trips SETTINGS_NVS_CACHE_OVFL is therefore the
# cumulative distinct names written during one uptime, and create/delete cycles —
# BT bond + CCC records across re-pairing, `ext/<name>` blobs as extensions are
# installed and removed over FILE_MGMT — push it up without bound until reboot.
#
# Static worst case for this tree is roughly 90-100: ~33 persistent characteristic
# keys, up to 16 extension param keys plus 16 extension shuffle-include keys, the
# glim keys, and BT bonding keys for CONFIG_BT_MAX_PAIRED. 256 entries clears that
# with churn headroom on top, and costs 1 KB of RAM (4 B/entry: uint16 hash +
# uint16 id).
#
# **Overflow is silent** — no log, no error, it just reverts to the full walk and
# the 850-1500 ms miss cost comes back. If settings latency ever regresses, check
# this budget first.
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE_SIZE=256

# Needed to make LEDs go brr
CONFIG_SPI_ASYNC=y
CONFIG_POLL=y

# Allow for large Bluetooth data packets.
# This speeds up DFU over Bluetooth.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_TX_SIZE=502

# Deepen the host TX buffer pool (NCS default is only 3). L2CAP_TX_BUF_COUNT,
# ATT_TX_COUNT and CONN_TX_MAX all default to this symbol, so one bump raises the
# whole ATT/L2CAP/ACL notification path. The default 3 was exhausted by bursty
# notifiers - the battery/power services fan out up to ~12 notifies in one 500ms
# pass, and (before its own fix) the Text animation could notify every render tick -
# producing "bt_att: Unable to allocate buffer for op 0x1b" / notify -ENOMEM (-12).
# Cost measured against the linker map: proto0 appcore RAM 80.5% -> 81.6% (~+4.8KB for
# the 5 extra ACL TX buffers - the 502B payload plus net_buf/reserve overhead each, and
# the matching CONN_TX contexts). Plenty of headroom remains; no FLASH impact.
CONFIG_BT_BUF_ACL_TX_COUNT=8

# Enable the Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Increased from default 2048 -- required for `fatfs reformat` (mkfs), verified as the real
# worst case (issue #75): high-water mark hit 5060 B out of the previous 8192 B budget during
# reformat (appcfg erase, the other destructive op, stayed lower). 6656 B leaves ~30% margin.
CONFIG_SHELL_STACK_SIZE=6656

# Validate mem slabs, debugging DMIC
CONFIG_MEM_SLAB_POINTER_VALIDATE=y

# Enable the LittleFS file system.
# Disabled to save ROM
# CONFIG_FILE_SYSTEM=y
# CONFIG_FILE_SYSTEM_LITTLEFS=y

# Disable Bluetooth ping support
# CONFIG_BT_CTLR_LE_PING=n

# Non-zero heap is required for libmetal to be able to allocate
CONFIG_KERNEL_MEM_POOL=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Save A LOT of memory! ~30KB
CONFIG_ASSERT=n

# No %f/%g formatting anywhere in the firmware (issue #79 ROM investigation): the only
# float prints were sound.cpp's AGC debug output, converted to integer fixed-point
# (see fmt_fixed4 there). Dropping printf float support removes __dtoa_engine and the
# float paths of vfprintf from both cbprintf (logging/shell) and picolibc (~10KB FLASH).
# A %f that sneaks back in prints the literal format specifier instead of the value --
# it does not crash.
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_PICOLIBC_IO_FLOAT=n


# Save generated pre-processed files
# Helpful for debugging macro expansion issues
# CONFIG_COMPILER_SAVE_TEMPS=y

# The TPS25750 patch is served uncompressed straight from rodata: LZ4-compressing it
# saved ~4.8KB of FLASH but cost a permanently-resident 14.3KB decompression buffer in
# RAM (issue #75 follow-up RAM pass), so the *patch* stays uncompressed here.
# The legacy DK board (dk-support branch) overrides all three of these back to the
# compressed form in its board .conf — its internal-flash image slot has no room for
# the uncompressed patch.
CONFIG_TPS25750_INTERNAL_PATCH=y
CONFIG_TPS25750_COMPRESSED_PATCH=n
CONFIG_TPS25750_PATCH_HEADER_FILE="tps25750/tps25750-config-uncompressed.h"

# LZ4 library — used by the GLIM decoder's Lz4PerFrame/Lz4PerFrameRgb24 formats
# (src/storage/glim_decoder.cpp) to decompress one animation frame per tick. This
# is decode-only; the compressed-frame scratch (~1.5KB) lives in the single
# GlimPlayerAnimation instance, not the 14.3KB TPS patch buffer above (which stays
# off, gated by CONFIG_TPS25750_COMPRESSED_PATCH=n). Enabling this only links the
# LZ4 code in — no runtime cost when no LZ4 GLIM is playing.
CONFIG_LZ4=y

# Include reboot API
CONFIG_REBOOT=y

CONFIG_NETCORE_VERSION_IPC=y

### MCUmgr
# Originally: 
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y

# Needed by MCUMgr
CONFIG_ZCBOR=y

# Enable MCUmgr
CONFIG_MCUMGR=y

# Enable MCUmgr over UART
# In the board file, we assign this to a USB-CDC UART
CONFIG_MCUMGR_TRANSPORT_UART=y

# Needed by CONFIG_MCUMGR_TRANSPORT_UART
CONFIG_BASE64=y

# Enable MCUmgr over Bluetooth
CONFIG_MCUMGR_TRANSPORT_BT=y

# Explicitly OFF (issue #188): this transport-level auto-tuner requested 7.5-11.25ms with a
# 420ms supervision timeout on every SMP packet - parameters iOS rejects outright (Apple
# QA1931 requires a 2-6s timeout) - and its post-DFU "restore" target is the PPCP values,
# which must stay fast for the Android connect-excursion reason above. It was also a second,
# independent firmware-side requester that would fight the conn-param governor in
# bluetooth.cpp; the governor replaces it using the mgmt hooks below (DFU_STARTED/STOPPED),
# with iOS-legal parameter sets.
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=n
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y

# MCUmgr event hooks feeding the conn-param governor (issue #188): DFU upload start/stop
# boosts the connection to the FAST set for the transfer, and every SMP command counts as
# inbound activity for the idle-downgrade clock. See gov_mgmt_evt_cb in src/bluetooth.cpp.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
CONFIG_MCUMGR_GRP_IMG_STATUS_HOOKS=y

# Require encryption + authentication (L4-class access) on the MCUmgr SMP DFU
# characteristic. This is already the NCS default when BT_SMP is enabled - stated
# explicitly (issue #232) so a future upstream default change can't silently leave
# the DFU path open. The _ENCRYPT variant remains available below if ever needed.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y

# Require encryption (only) for access
# CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_ENCRYPT=y

# Enable DFU image management commands
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y

# MCUboot version BLE service + shell command.
# The legacy DK board (dk-support branch) disabled this — see fw/Kconfig.
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOTLOADER_INFO=y
CONFIG_RETENTION_BOOTLOADER_INFO_TYPE_MCUBOOT=y
CONFIG_RETENTION_BOOTLOADER_INFO_OUTPUT_FUNCTION=y
CONFIG_APP_MCUBOOT_INFO_SERVICE=y

# Enable enumeration commands (querying supported command groups)
CONFIG_MCUMGR_GRP_ENUM=y

# The main thread runs C++ static construction and every APPLICATION-level SYS_INIT,
# which is why this is far larger than a typical Zephyr main stack. Right-sized against
# measurement rather than the original guess (issue #105); figures from
# `kernel thread stacks` on proto0, which reports a true high-water mark because
# CONFIG_INIT_STACKS + CONFIG_THREAD_STACK_INFO paint the stack at creation.
#
# THE DIRECT MEASUREMENT, which is the one to trust:
#
#   main, on a boot where a full volume format provably ran on THIS thread ... 7,684 B
#
# Forced with `fatfs corrupt confirm` (src/storage/storage.cpp) followed by a reset, so
# fs_mount() failed and CONFIG_FS_FATFS_MOUNT_MKFS reformatted inside
# SYS_INIT(mount_fat, APPLICATION). Confirmed it actually ran rather than assuming: the
# provisioned .glim assets were gone afterwards. main measured the same 7,684 B as an
# ordinary boot, so the format is SHALLOWER than the static-init peak and does not set
# the high-water mark at all. 16 KB leaves 8,700 B spare on that path.
#
# WHY THE FORMAT PATH IS THE ONE THAT MATTERS: an undersized main stack does not fail on
# a healthy device. It fails on a device whose filesystem is already broken — the auto
# format runs on this thread, overflows, and boot-loops a board recoverable only by
# J-Link. There are two callers, not one: the auto-format branch inside fatfs_mount(),
# and factory_reset_boot_check() (SYS_INIT APPLICATION prio 0), which calls
# storage_fat_wipe_for_reset() on this same thread.
#
# CONSERVATIVE CROSS-CHECK. f_mkfs is expensive: both mkfs paths in
# zephyr/subsys/fs/fat_fs.c put a `uint8_t work[FF_MAX_SS]` on the caller's stack, and
# CONFIG_FS_FATFS_MAX_SS is 4096 here — so that ONE array is 4 KB, and the subtree
# measures ~5 KB (src/debug/coredump_manager.cpp records the same ~5 KB figure). Assuming
# it stacked entirely on top of the 7,684 B peak (it does not, per the direct measurement
# above) puts a pessimistic floor near 12.7 KB. 16,384 clears even that.
#
# DO NOT re-measure this by diffing another thread's high-water across `fatfs reformat`.
# That method under-reports: the prior high-water is not that thread's depth at the moment
# the command is invoked, so the difference understates the true additional depth. It is
# how an earlier revision of this comment arrived at 3,736 B for a subtree containing a
# single 4,096 B array. Measure main directly on a boot that actually formats.
#
CONFIG_MAIN_STACK_SIZE=16384

