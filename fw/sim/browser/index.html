<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>rgbx extension simulator</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">rgbx<span>simulator</span></div>
      <label class="field inline">
        <span>Extension</span>
        <select id="ext-select"></select>
      </label>
      <button id="ext-reload" class="btn" title="Re-fetch the module and re-activate">Reload</button>
      <div id="ext-meta" class="meta"></div>
    </header>

    <div id="fault" class="fault hidden">
      <div class="fault-body">
        <strong id="fault-kind"></strong>
        <span id="fault-detail"></span>
      </div>
      <button id="fault-clear" class="btn btn-danger">Clear fault &amp; retry</button>
    </div>

    <main class="layout">
      <section class="stage">
        <div class="canvas-wrap"><canvas id="glasses"></canvas></div>

        <div class="transport">
          <button id="play" class="btn btn-primary">Pause</button>
          <button id="step" class="btn">Step</button>
          <label class="field inline">
            <span>Brightness</span>
            <select id="brightness">
              <option value="full">Full (&times;1)</option>
              <option value="device">Device (&times;0.02)</option>
              <option value="device-boost">Device (&times;0.02), boosted</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="decimate" checked /> 30 Hz display</label>
        </div>

        <div class="stats" id="stats"></div>

        <div class="card buttons-card">
          <h3>Buttons <span class="hint">arrow keys &middot; space = Wake</span></h3>
          <div class="buttons" id="buttons"></div>
        </div>
      </section>

      <section class="side">
        <nav class="tabs">
          <button class="tab active" data-tab="params">Params</button>
          <button class="tab" data-tab="inputs">Inputs</button>
          <button class="tab" data-tab="console">Console</button>
        </nav>

        <div class="tab-panel active" id="tab-params">
          <div class="panel-actions">
            <button id="param-reset" class="btn">Reset to defaults</button>
          </div>
          <div id="params"></div>
        </div>

        <div class="tab-panel" id="tab-inputs">
          <div class="card">
            <h3>Audio</h3>
            <label class="field">
              <span>Source</span>
              <select id="audio-source">
                <option value="silence">Silence</option>
                <option value="metronome">Metronome</option>
                <option value="sweep">Sweep 60 &rarr; 6000 Hz</option>
                <option value="noise">Pink noise</option>
                <option value="file">Audio file</option>
                <option value="mic">Microphone</option>
              </select>
            </label>
            <label class="field" data-for="metronome">
              <span>Tempo <b id="audio-bpm-value">120</b> BPM</span>
              <input type="range" id="audio-bpm" min="60" max="200" step="1" value="120" />
            </label>
            <label class="field" data-for="metronome sweep noise">
              <span>Gain <b id="audio-gain-value">-6</b> dBFS</span>
              <input type="range" id="audio-gain" min="-40" max="0" step="1" value="-6" />
            </label>
            <div class="field" data-for="file">
              <span>Clip</span>
              <input type="file" id="audio-file" accept="audio/*" />
              <div class="hint" id="audio-file-info">No file loaded.</div>
            </div>
            <div class="field" data-for="mic">
              <button id="mic-toggle" class="btn">Enable microphone</button>
              <div class="meter"><div id="mic-level"></div></div>
              <div class="hint">
                Needs a secure context: http://localhost, or RGBX_SIM_SSL=1 over the LAN.
              </div>
            </div>
            <div class="readout" id="audio-readout"></div>
          </div>

          <div class="card">
            <h3>IMU</h3>
            <label class="field">
              <span>Source</span>
              <select id="imu-source">
                <option value="static">Static</option>
                <option value="mouse">Tilt from mouse (drag the canvas)</option>
                <option value="orientation">DeviceOrientation</option>
                <option value="motion">DeviceMotion</option>
              </select>
            </label>
            <div id="imu-static" data-for="static"></div>
            <div class="field" data-for="orientation motion">
              <button id="imu-permission" class="btn">Grant motion access</button>
              <div class="hint">Required on iOS; a no-op elsewhere.</div>
            </div>
            <div class="readout" id="imu-readout"></div>
          </div>
        </div>

        <div class="tab-panel" id="tab-console">
          <div class="panel-actions">
            <button id="console-clear" class="btn">Clear</button>
          </div>
          <pre id="console"></pre>
        </div>
      </section>
    </main>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
