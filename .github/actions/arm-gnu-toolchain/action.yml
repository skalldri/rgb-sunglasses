name: arm gnu toolchain
description: >-
  The pinned Arm GNU Toolchain (cached) for building rgbx .llext extensions
  without the Zephyr SDK. The version pin lives where the install script
  reads it (ARM_TOOLCHAIN_VERSION in fw/sdk/scripts/install-arm-toolchain.sh);
  this action only greps it. The cache path is deliberately the toolchain's
  own version-scoped subdirectory, NOT the whole ~/.cache/rgb-sunglasses dir —
  the sim-wasm-toolchain action caches that whole dir under its own key, and a
  whole-dir save from a job that also installed this (~1 GB extracted)
  toolchain would bloat the wasi cache entry.

  Third-party actions are pinned by commit SHA, not by tag: a tag can be
  repointed, and a cached compiler is the last place to accept a moving
  target. The cache key includes the installer's own hash so that changing a
  version or a digest pin cannot be satisfied from an entry saved under the
  previous pin. That is defence in depth rather than the guarantee: the
  installer refuses to use a restored tree that does not carry the digest it
  was verified against.

runs:
  using: composite
  steps:
    - name: Compute ARM toolchain cache key
      id: toolchain-key
      shell: bash
      run: echo "version=$(grep -oP 'ARM_TOOLCHAIN_VERSION="\K[^"]+' fw/sdk/scripts/install-arm-toolchain.sh)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        # Cache the verified distribution archive, which is the installer's
        # trust anchor; the extracted tree is re-derived from it each run.
        path: ~/.cache/rgb-sunglasses/arm-gnu-toolchain-*.tar.xz
        key: arm-gnu-${{ steps.toolchain-key.outputs.version }}-${{ hashFiles('fw/sdk/scripts/install-arm-toolchain.sh') }}

    - name: Install ARM toolchain (cached)
      shell: bash
      run: fw/sdk/scripts/install-arm-toolchain.sh
