name: 'release'
on:
  push:
    tags:
      # Firmware releases use an fw-v* prefix so they don't collide with the
      # app's app-v* release tags in this monorepo.
      - 'fw-v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check HDD space
        run: df -h

      - name: Checkout (GitHub)
        uses: actions/checkout@v5

      - name: Parse version from tag
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          # Remove 'fw-v' prefix (e.g. fw-v1.2.3 -> 1.2.3)
          VERSION="${TAG#fw-v}"
          # Split into MAJOR.MINOR.PATCH
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT

      - name: Generate VERSION file
        run: |
          cat > /tmp/VERSION << EOF
          VERSION_MAJOR = ${{ steps.version.outputs.major }}
          VERSION_MINOR = ${{ steps.version.outputs.minor }}
          PATCHLEVEL = ${{ steps.version.outputs.patch }}
          VERSION_TWEAK = 0
          EXTRAVERSION = stable
          EOF
          cat /tmp/VERSION > ${{ github.workspace }}/fw/VERSION

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Proto0 firmware
        uses: devcontainers/ci@v0.3
        with:
          imageName: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          cacheFrom: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          configFile: .devcontainer/ci/devcontainer.json
          push: never
          # No fw/extensions/build.sh here: in-repo extensions (hello, cpptest)
          # are dev tools that never attach to releases — their compile check
          # lives in build.yaml's PR/merge gate, and a fixture failure must not
          # block a firmware release.
          runCmd: west build --build-dir /workspaces/rgb-sunglasses/fw/build /workspaces/rgb-sunglasses/fw --pristine --board rgb_sunglasses_proto0/nrf5340/cpuapp --sysbuild -- -DBOARD_ROOT="/workspaces/rgb-sunglasses/fw" -DVERSION_TWEAK_MODE=release

      - name: Copy Proto0 DFU artifact
        run: cp ${{ github.workspace }}/fw/build/dfu_application.zip ${{ github.workspace }}/dfu_application_proto0.zip

      # Host-side on purpose: package-sdk.sh only copies from source-tree
      # locations (never fw/build, which is root-owned after the
      # devcontainer build step) and writes to the workspace root.
      - name: Package rgbx-sdk
        run: fw/sdk/package-sdk.sh --version ${{ steps.version.outputs.version }} --output ${{ github.workspace }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          # Asset names are an API consumed by the in-app updater
          # (app/services/github-releases.ts findAssetForBoard: first asset whose
          # name contains the board revision AND ends with .zip). Bare *.llext
          # names are safe; never bundle extensions as a zip with "proto0"/"dk"
          # in its name or it can shadow the dfu_application zips (the app still
          # matches "dk" against older releases; DK builds now live only on the
          # dk-support branch, and DK releases must never reuse the fw-v* tag
          # prefix — the app serves the latest fw-v* release to proto0 users).
          #
          # NO in-repo-built .llext files attach here: every shipped extension
          # comes from the community registry (extensions/registry.json) via
          # the attach-community job below. In-repo extensions (hello, cpptest)
          # are dev/debug tools — built by CI as a check, never released.
          files: |
            ${{ github.workspace }}/dfu_application_proto0.zip
            ${{ github.workspace }}/rgbx-sdk-*.tar.gz
          body: "Release ${{ steps.version.outputs.version }}"
          # Draft until attach-community flips it live: the app treats the
          # latest release's asset list as complete, so publishing before
          # the community .llext assets attach would give devices updating
          # in that window a release with the community extensions missing.
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Community extensions (extensions/registry.json): rebuilt from their
  # pinned commits against this checkout's SDK, in the sandboxed reusable
  # workflow (untrusted code runs there with read-only permissions and no
  # secrets). Never blocks the firmware release — a failing extension just
  # misses this release (attach-community below still turns RED for it, so
  # the miss is a visible signal on the run, not a silent asset gap).
  community:
    needs: release
    uses: ./.github/workflows/community-extensions.yml

  # Trusted side of the handoff: collect whichever per-extension artifacts
  # succeeded, attach them, and publish the draft. if: always() so a broken
  # community extension (or an empty registry, where the community build job
  # is skipped) never leaves the firmware release unpublished; gated on the
  # release job itself having succeeded. Publish happens BEFORE the
  # completeness check: a missing registry extension must fail this job
  # loudly, but never hold the firmware release hostage.
  attach-community:
    needs: [release, community]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          pattern: community-ext-*
          merge-multiple: true
          path: community
      - name: Attach community .llext files
        run: |
          shopt -s nullglob
          files=(community/*.llext)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no community extension artifacts to attach"
            exit 0
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false
      # After publishing: every registry entry must have made it onto the
      # release. A miss means devices syncing from this release silently lose
      # that extension — make it a red job (with the release already live).
      - name: Fail if any registry extension missed the release
        run: |
          missing=0
          for name in $(jq -r '.extensions[].name' extensions/registry.json); do
            if [ ! -f "community/$name.llext" ]; then
              echo "::error::registry extension '$name' failed to build and is ABSENT from $TAG — devices will not receive it"
              missing=1
            fi
          done
          exit $missing
