name: Deploy Project Site (GitHub Pages)

# Publishes the static project site under `site/` to GitHub Pages, served at the
# custom domain https://rgb-sunglasses.autom8ed.com (see site/CNAME); the privacy
# policy lives at /privacy. Selected in-repo Markdown docs are rendered into the
# site by scripts/build-site.py (single source of truth) — e.g. the firmware
# recovery guide at /recovery, sourced from fw/docs/flashing-without-jlink.md.
# Only the `site/` folder is uploaded, so internal design docs under `docs/plans/`
# are never published. The extension simulator (fw/sim) is built here as a Vite
# bundle and composed into site/sim/ — served at /sim. The rgbx extension API
# reference is built with Doxygen and composed into site/api/ — served at /api.
#
# This is the ONLY workflow that deploys Pages: GitHub allows a single
# deployment source, and the upload below ships the whole `site/` tree. A second
# workflow calling deploy-pages would replace all of it (/docs, /sim, /api,
# /privacy), so compose new sub-sites in here rather than adding one.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/build-site.py'
      - 'fw/docs/flashing-without-jlink.md'
      - 'fw/docs/proto0-user-guide.md'
      - 'fw/docs/proto0-assembly-guide.md'
      - 'fw/docs/proto0-hardware-guide.md'
      - 'fw/docs/imu-coordinate-frame.md'
      - 'fw/docs/developer-setup.md'
      - 'fw/docs/images/**'
      # The extension simulator ships at /sim — redeploy when it (or the
      # extensions/DSP its bundled .wasm modules are built from) changes.
      # fw/extensions/** and fw/include/rgbx/** additionally cover the API
      # reference at /api: the Doxyfile, its vendored theme, the front-page
      # README, and the documented headers.
      - 'fw/sim/**'
      - 'fw/extensions/**'
      - 'fw/include/rgbx/**'
      - 'fw/src/sound/audio_dsp*'
      # The remaining page rendered into /api by Doxygen.
      - 'extensions/README.md'
      - '.github/actions/doxygen/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The API docs stamp PROJECT_NUMBER from `git describe` against the
          # fw-v* tags, which a shallow clone doesn't have.
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (source = GitHub Actions) if it isn't already, so the
          # first deploy can't fail on a repo where Pages was never turned on.
          enablement: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Render Markdown docs into the site
        # Renders the docs listed in scripts/build-site.py (e.g. the recovery
        # guide) into site/<page>/index.html so the Markdown stays the single
        # source of truth. Generated pages are git-ignored and produced here.
        run: |
          python -m pip install --upgrade markdown pymdown-extensions
          python scripts/build-site.py

      # ---- Extension simulator (served at /sim) --------------------------
      # Builds the in-repo extensions + the real audio DSP to wasm and
      # bundles the simulator UI. Toolchain steps are the SAME composite
      # action sim-ci.yml gates with, so a deploy can never use a different
      # toolchain than the one CI validated.
      - uses: ./.github/actions/sim-wasm-toolchain

      - name: Build simulator bundle into site/sim
        run: |
          fw/sim/build-extensions.sh
          cd fw/sim
          npm ci
          RGBX_SIM_BASE=/sim/ npx vite build
          # rm first: cp -r nests into an EXISTING destination (dst/browser/),
          # which would silently 404 the deployed page. Fresh runners never
          # have site/sim, but keep the step idempotent regardless.
          rm -rf ../../site/sim
          cp -r dist/browser ../../site/sim

      # ---- Extension API reference (served at /api) ----------------------
      # Doxygen over fw/include/rgbx plus the extension-author guides. The
      # pinned-Doxygen action is the SAME one sdk-ci.yml's `docs` job gates
      # with, so a deploy can never use a different Doxygen than the one CI
      # validated (same rationale as sim-wasm-toolchain above).
      #
      # These two steps are deliberately FATAL to the deploy rather than
      # `continue-on-error`, even though that means an upstream Doxygen
      # download failure (on a cache miss) can block a push that only touched
      # fw/docs/**. The alternative is worse: the upload below ships the whole
      # site/ tree, so continuing past a failed docs build would publish a site
      # with no site/api at all — turning a transient outage into a live 404
      # for every /api URL. Failing loudly leaves the previous deploy intact.
      # The download is cached and retried (see the action); the content of
      # these steps is gated pre-merge by sdk-ci.yml's `docs` job.
      - uses: ./.github/actions/doxygen

      - name: Build extension API docs into site/api
        run: |
          # Same script sdk-ci.yml gates with and developers run locally.
          fw/extensions/build-docs.sh
          # rm first: cp -r nests into an EXISTING destination (dst/html/),
          # which would silently 404 the deployed page. Same trap as site/sim.
          rm -rf site/api
          cp -r fw/build/doxygen/html site/api

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
