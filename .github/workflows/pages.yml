name: Deploy Project Site (GitHub Pages)

# Publishes the static project site under `site/` to GitHub Pages, served at the
# custom domain https://rgb-sunglasses.autom8ed.com (see site/CNAME); the privacy
# policy lives at /privacy. Selected in-repo Markdown docs are rendered into the
# site by scripts/build-site.py (single source of truth) — e.g. the firmware
# recovery guide at /recovery, sourced from fw/docs/flashing-without-jlink.md.
# Only the `site/` folder is uploaded, so internal design docs under `docs/plans/`
# are never published. The extension simulator (fw/sim) is built here as a Vite
# bundle and composed into site/sim/ — served at /sim.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/build-site.py'
      - 'fw/docs/flashing-without-jlink.md'
      - 'fw/docs/proto0-user-guide.md'
      - 'fw/docs/proto0-assembly-guide.md'
      - 'fw/docs/proto0-hardware-guide.md'
      - 'fw/docs/developer-setup.md'
      - 'fw/docs/images/**'
      # The extension simulator ships at /sim — redeploy when it (or the
      # extensions/DSP its bundled .wasm modules are built from) changes.
      - 'fw/sim/**'
      - 'fw/extensions/**'
      - 'fw/include/rgbx/**'
      - 'fw/src/sound/audio_dsp*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (source = GitHub Actions) if it isn't already, so the
          # first deploy can't fail on a repo where Pages was never turned on.
          enablement: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Render Markdown docs into the site
        # Renders the docs listed in scripts/build-site.py (e.g. the recovery
        # guide) into site/<page>/index.html so the Markdown stays the single
        # source of truth. Generated pages are git-ignored and produced here.
        run: |
          python -m pip install --upgrade markdown pymdown-extensions
          python scripts/build-site.py

      # ---- Extension simulator (served at /sim) --------------------------
      # Builds the in-repo extensions + the real audio DSP to wasm and
      # bundles the simulator UI. Mirrors sim-ci.yml's toolchain steps
      # (cached wasi-sdk, CMSIS-DSP pinned via CMSIS_DSP_PIN in
      # build-extensions.sh — the single source of truth for that revision).
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: fw/sim/package-lock.json

      - name: Compute wasm toolchain cache key
        id: toolchain-key
        run: echo "version=$(grep -oP 'WASI_SDK_VERSION="\K[^"]+' fw/sim/scripts/install-toolchain.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/rgb-sunglasses
          key: wasi-sdk-${{ steps.toolchain-key.outputs.version }}

      - name: Install wasm toolchain (cached)
        run: fw/sim/scripts/install-toolchain.sh

      - name: Fetch CMSIS-DSP (pinned revision from build-extensions.sh)
        run: |
          rev="$(grep -oP 'CMSIS_DSP_PIN="\K[0-9a-f]+' fw/sim/build-extensions.sh)"
          git init /tmp/cmsis-dsp
          git -C /tmp/cmsis-dsp remote add origin https://github.com/zephyrproject-rtos/cmsis-dsp.git
          git -C /tmp/cmsis-dsp fetch --depth 1 origin "$rev"
          git -C /tmp/cmsis-dsp checkout FETCH_HEAD
          echo "CMSIS_DSP_PATH=/tmp/cmsis-dsp" >> "$GITHUB_ENV"

      - name: Build simulator bundle into site/sim
        run: |
          fw/sim/build-extensions.sh
          cd fw/sim
          npm ci
          RGBX_SIM_BASE=/sim/ npx vite build
          # rm first: cp -r nests into an EXISTING destination (dst/browser/),
          # which would silently 404 the deployed page. Fresh runners never
          # have site/sim, but keep the step idempotent regardless.
          rm -rf ../../site/sim
          cp -r dist/browser ../../site/sim

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
