name: Extension Simulator CI

# Fast Node-only job (no devcontainer, no ARM toolchain): builds the two
# in-repo extensions to WASM, runs the harness unit/integration tests, the
# scenario smoke runs, the fault-path assertions (hello's Crash/Hang), and
# the golden digest compare. The audio-DSP parity check against the
# native_sim replay harness lives in build.yaml (needs west).
on:
  pull_request:
    paths:
      - "fw/extensions/**"
      - "fw/include/rgbx/**"
      - "fw/sim/**"
      - "fw/src/sound/audio_dsp*"
      - ".github/workflows/sim-ci.yml"
  push:
    branches: [main]
    paths:
      - "fw/extensions/**"
      - "fw/include/rgbx/**"
      - "fw/sim/**"
      - "fw/src/sound/audio_dsp*"
      - ".github/workflows/sim-ci.yml"

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Node + pinned wasi-sdk (cached) + pinned CMSIS-DSP — shared with
      # pages.yml via the composite action so the pre-merge gate always
      # validates with the exact toolchain the deploy builds with.
      - uses: ./.github/actions/sim-wasm-toolchain

      - name: npm ci
        run: cd fw/sim && npm ci

      - name: Build extensions + audio_dsp to wasm
        run: fw/sim/build-extensions.sh

      - name: Unit + integration tests
        run: cd fw/sim && npm test

      - name: Scenario smoke — visible rendering
        run: |
          fw/sim/rgbx-sim run hello  --scenario metronome-120 --no-build --json > /dev/null
          fw/sim/rgbx-sim run hello  --scenario buttons-tour  --no-build --json > /dev/null
          fw/sim/rgbx-sim run hello  --scenario head-tilt     --no-build --json > /dev/null
          fw/sim/rgbx-sim run hello  --scenario head-roll     --no-build --json > /dev/null
          fw/sim/rgbx-sim run hello  --scenario dance         --no-build --json > /dev/null
          fw/sim/rgbx-sim run cpptest --scenario silence      --no-build --json > /dev/null
          # Device captures (real WAV + IMU keyframes) — the beat detector's
          # negative corpus (no music playing; see fw/docs/beat-detection-debugging.md).
          fw/sim/rgbx-sim run hello  --scenario walk-no-music-1    --no-build --json > /dev/null
          fw/sim/rgbx-sim run hello  --scenario head-roll-no-music --no-build --json > /dev/null

      - name: Fault paths — Crash traps, Hang hits the backstop
        run: |
          fw/sim/rgbx-sim run hello --scenario param-crash --no-build --json > /dev/null
          fw/sim/rgbx-sim run hello --scenario param-hang  --no-build --json > /dev/null

      - name: Golden digest compare
        run: fw/sim/rgbx-sim compare

      # Pages deploys only from main; this is the pre-merge guard that the
      # /sim/-based production bundle still builds and ships EVERY built
      # module (derived from out/wasm, not a hardcoded name list — retiring
      # or adding an extension must not require editing this step).
      - name: Production bundle builds under the /sim/ base
        run: |
          cd fw/sim
          RGBX_SIM_BASE=/sim/ npx vite build
          test -f dist/browser/wasm-index.json
          for m in out/wasm/*.wasm; do
            test -f "dist/browser/$(basename "$m")"
          done
          grep -q '/sim/assets/' dist/browser/index.html
          # Scenario playback: the index plus EVERY scenario file must ship
          # (derived from scenarios/, same no-hardcoded-list rule as above).
          test -f dist/browser/scenario-index.json
          for s in scenarios/*.json; do
            test -f "dist/browser/scenarios/$(basename "$s")"
          done

      - name: Upload run reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sim-reports
          path: fw/sim/out/runs/**/report.json
          if-no-files-found: ignore
