name: 'scripts-ci'
on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/scripts-ci.yml'

jobs:
  scripts-tests:
    # Pure-Python unit tests for host tooling under scripts/ (e.g. re-pair.py's
    # device-forget selectors, validated against sanitized uiautomator-dump fixtures).
    # Deliberately a standalone, devcontainer-free job so a scripts-only change does
    # not trigger the heavy firmware builds in build.yaml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytest

      - name: Run scripts/ tests
        run: pytest scripts/tests/ -v

      # pr-watch.sh carries its own offline state-machine suite. It needs no
      # network or gh token, so there is no reason for it to be the one test
      # nothing runs.
      - name: pr-watch.sh self-test
        run: bash scripts/pr-watch.sh --self-test

      # Scoped to pr-watch.sh deliberately: scripts/fw-env.sh trips a
      # pre-existing SC1090 (non-constant source), and widening this step would
      # mean either a red build for an unrelated file or suppressing someone
      # else's warning from this PR.
      - name: Shellcheck pr-watch.sh
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/pr-watch.sh
