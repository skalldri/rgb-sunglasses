# Pre-merge gate for the standalone rgbx-sdk (fw/sdk/): packages the SDK,
# then builds the in-repo hello + cpptest extensions through it for BOTH
# targets with the pinned toolchains in strict mode, and checks parity
# against the established fw/sim/build-extensions.sh output.
#
# Deliberately devcontainer-free (precedent: scripts-ci.yml) — the whole
# point of the SDK is that extension builds need no Zephyr/west, so this
# gate proves it on a bare runner. See fw/docs/standalone-extension-repos.md.
name: sdk-ci

on:
  pull_request:
    paths:
      - 'fw/sdk/**'
      - 'fw/include/rgbx/**'
      - 'fw/sim/shim/**'
      - 'fw/sim/scripts/**'
      - 'fw/sim/build-extensions.sh'
      - 'fw/extensions/**'
      - '.github/actions/arm-gnu-toolchain/**'
      - '.github/actions/wasi-sdk-scoped/**'
      - '.github/actions/package-rgbx-sdk/**'
      - '.github/workflows/sdk-ci.yml'
  push:
    branches: [main]
    paths:
      - 'fw/sdk/**'
      - 'fw/include/rgbx/**'
      - 'fw/sim/shim/**'
      - 'fw/sim/scripts/**'
      - 'fw/sim/build-extensions.sh'
      - 'fw/extensions/**'
      - '.github/actions/arm-gnu-toolchain/**'
      - '.github/actions/wasi-sdk-scoped/**'
      - '.github/actions/package-rgbx-sdk/**'
      - '.github/workflows/sdk-ci.yml'

jobs:
  sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ./.github/actions/arm-gnu-toolchain
      - uses: ./.github/actions/wasi-sdk-scoped

      - uses: ./.github/actions/package-rgbx-sdk
        with:
          version: 0.0.0-ci

      - name: Build hello + cpptest via the SDK (arm, strict)
        run: |
          cmake -S fw/sdk/tests/consumer -B "$RUNNER_TEMP/b-arm" \
            -DRGBX_SDK_SOURCE_DIR="$SDK_DIR" -DRGBX_TARGET=arm -DRGBX_STRICT_TOOLCHAIN=ON
          cmake --build "$RUNNER_TEMP/b-arm"

      - name: Assert expected undefined-symbol sets
        run: |
          TC="$(fw/sdk/scripts/install-arm-toolchain.sh)"
          NM="$TC/bin/arm-none-eabi-nm"
          # hello may need only memset + printk; cpptest must need nothing.
          for sym in $("$NM" -u "$RUNNER_TEMP/b-arm/hello.llext" | awk '{print $NF}'); do
            case "$sym" in memset|printk) ;; *) echo "unexpected undefined symbol in hello.llext: $sym"; exit 1 ;; esac
          done
          if [ -n "$("$NM" -u "$RUNNER_TEMP/b-arm/cpptest.llext")" ]; then
            echo "cpptest.llext should have no undefined symbols:"
            "$NM" -u "$RUNNER_TEMP/b-arm/cpptest.llext"
            exit 1
          fi
          # mathtest must actually exercise the issue #295 surface: the gate
          # passing proves ACCEPT; these prove the calls weren't inlined away.
          for want in sinf atan2f __aeabi_uldivmod memmove; do
            if ! "$NM" -u "$RUNNER_TEMP/b-arm/mathtest.llext" | grep -q "\b$want\$"; then
              echo "mathtest.llext should reference $want (did codegen inline it away?)"
              "$NM" -u "$RUNNER_TEMP/b-arm/mathtest.llext"
              exit 1
            fi
          done

      - name: Build hello + cpptest via the SDK (wasm, strict)
        run: |
          cmake -S fw/sdk/tests/consumer -B "$RUNNER_TEMP/b-wasm" \
            -DRGBX_SDK_SOURCE_DIR="$SDK_DIR" -DRGBX_TARGET=wasm -DRGBX_STRICT_TOOLCHAIN=ON
          cmake --build "$RUNNER_TEMP/b-wasm"

      - name: Compare wasm export/import sets against build-extensions.sh
        run: |
          fw/sim/build-extensions.sh hello cpptest
          node fw/sdk/tests/compare-wasm-exports.mjs "$RUNNER_TEMP/b-wasm/hello.wasm" fw/sim/out/wasm/hello.wasm
          node fw/sdk/tests/compare-wasm-exports.mjs "$RUNNER_TEMP/b-wasm/cpptest.wasm" fw/sim/out/wasm/cpptest.wasm
