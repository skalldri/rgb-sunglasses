# Pre-merge gate for the standalone rgbx-sdk (fw/sdk/): packages the SDK,
# then builds the in-repo hello + cpptest extensions through it for BOTH
# targets with the pinned toolchains in strict mode, and checks parity
# against the established fw/sim/build-extensions.sh output.
#
# Deliberately devcontainer-free (precedent: scripts-ci.yml) — the whole
# point of the SDK is that extension builds need no Zephyr/west, so this
# gate proves it on a bare runner. See fw/docs/standalone-extension-repos.md.
name: sdk-ci

on:
  pull_request:
    paths:
      - 'fw/sdk/**'
      - 'fw/include/rgbx/**'
      - 'fw/sim/shim/**'
      - 'fw/sim/scripts/**'
      - 'fw/sim/build-extensions.sh'
      - 'fw/extensions/**'
      # Published as part of the API docs (see the `docs` job) — editing it can
      # break the docs build on its own.
      - 'extensions/README.md'
      - '.github/actions/arm-gnu-toolchain/**'
      - '.github/actions/wasi-sdk-scoped/**'
      - '.github/actions/package-rgbx-sdk/**'
      - '.github/actions/doxygen/**'
      # The deploy step in pages.yml runs this same docs build; without
      # it here, editing that step merges with no docs job having run.
      - '.github/workflows/pages.yml'
      - '.github/workflows/sdk-ci.yml'
  push:
    branches: [main]
    paths:
      - 'fw/sdk/**'
      - 'fw/include/rgbx/**'
      - 'fw/sim/shim/**'
      - 'fw/sim/scripts/**'
      - 'fw/sim/build-extensions.sh'
      - 'fw/extensions/**'
      - 'extensions/README.md'
      - '.github/actions/arm-gnu-toolchain/**'
      - '.github/actions/wasi-sdk-scoped/**'
      - '.github/actions/package-rgbx-sdk/**'
      - '.github/actions/doxygen/**'
      # The deploy step in pages.yml runs this same docs build; without
      # it here, editing that step merges with no docs job having run.
      - '.github/workflows/pages.yml'
      - '.github/workflows/sdk-ci.yml'

jobs:
  sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: ./.github/actions/arm-gnu-toolchain
      - uses: ./.github/actions/wasi-sdk-scoped

      - uses: ./.github/actions/package-rgbx-sdk
        with:
          version: 0.0.0-ci

      # Third member of the allowed-symbols lockstep set (the other two are
      # extension_exports.c, checked by build.yaml's check-allowed-symbols.sh):
      # every sanctioned symbol must be DECLARED by <rgbx/rgbx_sys.h> with the
      # right prototype, or authors are back to hand-writing one and getting a
      # clean build that traps at runtime. Issue #351. Run against the packaged
      # SDK's include tree — that is what a standalone author actually gets —
      # under both real extension toolchains plus the host compiler, and in
      # BOTH languages: extensions are written in C and C++ alike (the C++
      # wrapper path is what getting-started.md leads with), and a C-only probe
      # cannot see a dropped `extern "C"` block or a collision with the
      # noexcept/overload set a C++ libc header attaches.
      - name: Check rgbx_sys.h declares the allowed-symbol surface
        run: |
          ARM_TC="$(fw/sdk/scripts/install-arm-toolchain.sh)"
          WASI_TC="$(fw/sim/scripts/install-toolchain.sh)"
          check() {
            fw/sdk/scripts/check-sys-header.sh --cc "$1" --lang "$2" \
              --include-dir "$SDK_DIR/include" --allowed "$SDK_DIR/arm/allowed-symbols.txt"
          }
          for cc in cc "$ARM_TC/bin/arm-none-eabi-gcc" "$WASI_TC/bin/clang"; do
            check "$cc" c
          done
          for cxx in c++ "$ARM_TC/bin/arm-none-eabi-g++" "$WASI_TC/bin/clang++"; do
            check "$cxx" c++
          done

      - name: Build hello + cpptest via the SDK (arm, strict)
        run: |
          cmake -S fw/sdk/tests/consumer -B "$RUNNER_TEMP/b-arm" \
            -DRGBX_SDK_SOURCE_DIR="$SDK_DIR" -DRGBX_TARGET=arm -DRGBX_STRICT_TOOLCHAIN=ON
          cmake --build "$RUNNER_TEMP/b-arm"

      - name: Assert expected undefined-symbol sets
        run: |
          TC="$(fw/sdk/scripts/install-arm-toolchain.sh)"
          NM="$TC/bin/arm-none-eabi-nm"
          # hello may need only memset + printk + vprintk; cpptest must need
          # nothing. vprintk joined the list with issue #351: hello routes its
          # first-tick line through a va_list helper so that the sanctioned
          # vprintk export has automated cover on both targets (the sim side
          # asserts its exact output in host.integration.test.ts). This list
          # stays exhaustive on purpose — widen it only for a symbol something
          # deliberately calls.
          for sym in $("$NM" -u "$RUNNER_TEMP/b-arm/hello.llext" | awk '{print $NF}'); do
            case "$sym" in memset|printk|vprintk) ;; *) echo "unexpected undefined symbol in hello.llext: $sym"; exit 1 ;; esac
          done
          # ...and vprintk must actually be there, or the cover above is a
          # no-op the next refactor deletes without noticing.
          if ! "$NM" -u "$RUNNER_TEMP/b-arm/hello.llext" | grep -q '\bvprintk$'; then
            echo "hello.llext should reference vprintk (issue #351 cover for the va_list path)"
            exit 1
          fi
          if [ -n "$("$NM" -u "$RUNNER_TEMP/b-arm/cpptest.llext")" ]; then
            echo "cpptest.llext should have no undefined symbols:"
            "$NM" -u "$RUNNER_TEMP/b-arm/cpptest.llext"
            exit 1
          fi
          # mathtest must actually exercise the issue #295 surface: the gate
          # passing proves ACCEPT; these prove the calls weren't inlined away.
          for want in sinf atan2f __aeabi_uldivmod memmove; do
            if ! "$NM" -u "$RUNNER_TEMP/b-arm/mathtest.llext" | grep -q "\b$want\$"; then
              echo "mathtest.llext should reference $want (did codegen inline it away?)"
              "$NM" -u "$RUNNER_TEMP/b-arm/mathtest.llext"
              exit 1
            fi
          done

      - name: Build hello + cpptest via the SDK (wasm, strict)
        run: |
          cmake -S fw/sdk/tests/consumer -B "$RUNNER_TEMP/b-wasm" \
            -DRGBX_SDK_SOURCE_DIR="$SDK_DIR" -DRGBX_TARGET=wasm -DRGBX_STRICT_TOOLCHAIN=ON
          cmake --build "$RUNNER_TEMP/b-wasm"

      # The version gate's reject side. check-wasm.mjs uses top-level await, so
      # an older node fails the wasm link with a bare SyntaxError from inside
      # the SDK, naming neither node nor a version (rgbx-extension-template#5).
      # The gate turns that into a message naming node, the version found and
      # the fix — this proves it still fires. Pre-setting RGBX_NODE fills the
      # cache entry find_program() would, so the stub is what gets checked.
      - name: Reject a too-old node
        run: |
          stub="$RUNNER_TEMP/old-node/node"
          mkdir -p "$(dirname "$stub")"
          printf '#!/bin/sh\necho v12.22.9\n' > "$stub"
          chmod +x "$stub"
          if cmake -S fw/sdk/tests/consumer -B "$RUNNER_TEMP/b-oldnode" \
               -DRGBX_SDK_SOURCE_DIR="$SDK_DIR" -DRGBX_TARGET=wasm \
               -DRGBX_NODE="$stub" > "$RUNNER_TEMP/oldnode.log" 2>&1; then
            echo "configure succeeded with node v12.22.9 — the version gate did not fire"
            exit 1
          fi
          # CMake hard-wraps message() text at ~78 columns, and where it wraps
          # depends on the runner's path lengths — so match against the log
          # with its whitespace flattened, never line by line.
          if ! tr '\n' ' ' < "$RUNNER_TEMP/oldnode.log" | tr -s ' ' | grep -q "is too old"; then
            echo "configure failed, but not with the version-gate message:"
            cat "$RUNNER_TEMP/oldnode.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/oldnode.log"

      - name: Compare wasm export/import sets against build-extensions.sh
        run: |
          fw/sim/build-extensions.sh hello cpptest
          node fw/sdk/tests/compare-wasm-exports.mjs "$RUNNER_TEMP/b-wasm/hello.wasm" fw/sim/out/wasm/hello.wasm
          node fw/sdk/tests/compare-wasm-exports.mjs "$RUNNER_TEMP/b-wasm/cpptest.wasm" fw/sim/out/wasm/cpptest.wasm

  # Warnings-are-errors gate for the extension API docs published at
  # https://rgb-sunglasses.autom8ed.com/api. The SAME build runs in pages.yml
  # with the SAME pinned Doxygen action, so a doc regression is caught here at
  # PR time instead of going live. The Doxyfile sets WARN_AS_ERROR,
  # WARN_IF_UNDOCUMENTED and WARN_NO_PARAMDOC — an undocumented public entity
  # or a half-documented parameter list fails this job. Fix the comment; don't
  # relax the Doxyfile.
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # PROJECT_NUMBER comes from `git describe` against the fw-v* tags,
          # which a shallow clone doesn't have.
          fetch-depth: 0

      - uses: ./.github/actions/doxygen

      # Same script developers run locally and pages.yml deploys with, so the
      # gate cannot diverge from either.
      - name: Build extension API docs (warnings are errors)
        run: fw/extensions/build-docs.sh
